<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Compare URLs part by part, with nested keys, lists, JSON, base64, JWT and Rison values decoded."
    />
    <title>compurl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap"
    />
  </head>
  <body>
    <header class="masthead">
      <h1 class="wordmark">compurl</h1>
      <p class="lede">
        Paste two or more URLs to see which parts and parameters differ. Decoding runs in this page,
        and nothing you paste is sent anywhere.
      </p>
    </header>

    <main>
      <section class="inputs" aria-label="URLs">
        <div id="urls" class="url-list"></div>
        <div class="actions">
          <button type="button" id="add">Add URL</button>
          <button type="button" id="example">Load example</button>
          <button type="button" id="share">Copy share link</button>
        </div>
      </section>

      <fieldset class="decoders">
        <legend>Decode values and keys as</legend>
        <div id="decoders" class="decoder-list"></div>
        <details class="decoder-details">
          <summary>What each rule does</summary>
          <dl id="decoder-help"></dl>
        </details>
      </fieldset>

      <section id="results" class="results" aria-label="Comparison"></section>
    </main>

    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
