<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Decode, edit and compare URLs, curl commands and shell commands part by part, down to the JWTs, base64 JSON and compressed SAML inside them."
    />
    <title>compurl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap"
    />
  </head>
  <body>
    <header class="masthead">
      <h1 class="wordmark">compurl</h1>
      <p class="lede">
        Paste a URL, a curl command or another shell command to see every part and parameter decoded
        and edit any of them, or paste several to see where they differ. Decoding runs in this page,
        and nothing you paste is sent anywhere.
      </p>
    </header>

    <main>
      <section class="inputs" aria-label="URLs">
        <div id="urls" class="url-list"></div>
        <div class="actions">
          <button type="button" id="add">Add URL</button>
          <select id="example" aria-label="Load an example">
            <option value="">Load an example…</option>
          </select>
          <button type="button" id="share">Copy share link</button>
        </div>
      </section>

      <details id="rules" class="rules" open>
        <summary>
          <span class="rules-title">Decoding and comparison rules</span>
          <span id="rules-count" class="rules-count"></span>
        </summary>
        <div id="decoders" class="decoder-list"></div>
        <details class="decoder-details">
          <summary>What each rule does</summary>
          <dl id="decoder-help"></dl>
        </details>
      </details>

      <section id="results" class="results" aria-label="Decoded parts"></section>
    </main>

    <div id="copy-menu" class="menu" role="menu" aria-label="Copy" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
